name: Bootstrap package lock

on:
  push:
    branches: [foundation-v0.1]
    paths:
      - package.json
      - .github/workflows/bootstrap-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: foundation-v0.1
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit package lock when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: generate package lock"
          git push origin HEAD:foundation-v0.1
